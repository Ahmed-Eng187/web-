<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هننزل بليل؟ 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container" id="mainContainer">
    <!-- Step 1: Question Card -->
    <div class="card" id="questionCard">
      <div class="emoji" id="emojiIcon">🥺✨</div>
      <h1 id="questionText">هننزل بليل؟</h1>
      <div class="buttons" id="buttonsWrapper">
        <button id="yesBtn" class="btn yes-btn">Yes</button>
        <button id="noBtn" class="btn no-btn">No</button>
      </div>
    </div>

    <!-- Step 2: Success & Choices Card -->
    <div class="card choices-card hidden" id="choicesCard">
      <div class="emoji">🥳💖✨</div>
      <h1>كنت عارف إنك هتوافقي كده كده</h1>
      <p class="subtitle">اختاري تفاصيل الخروجة 👇</p>

      <!-- Places Section -->
      <div class="section">
        <h3>📍 المكان</h3>
        <div class="places-grid" id="placesGrid">
          <div class="place-card" data-value="الزمالك">
            <div class="place-img zamalek-bg">
              <img src="https://images.unsplash.com/photo-1572252009286-268acec5ca0a?auto=format&fit=crop&w=500&q=80" alt="الزمالك" onerror="this.style.display='none'">
              <span class="place-badge">🌉 النيل والهدوء</span>
            </div>
            <div class="place-name">الزمالك</div>
          </div>

          <div class="place-card" data-value="التجمع">
            <div class="place-img tagamoa-bg">
              <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=500&q=80" alt="التجمع" onerror="this.style.display='none'">
              <span class="place-badge">✨ كافيهات وأجواء</span>
            </div>
            <div class="place-name">التجمع</div>
          </div>

          <div class="place-card" data-value="زايد">
            <div class="place-img zayed-bg">
              <img src="https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=500&q=80" alt="زايد" onerror="this.style.display='none'">
              <span class="place-badge">🌴 تمشية وروقان</span>
            </div>
            <div class="place-name">زايد</div>
          </div>
        </div>
      </div>

      <!-- Time Section -->
      <div class="section">
        <h3>⏰ ميعاد الخروجة</h3>
        <div class="times-grid" id="timesGrid">
          <button type="button" class="time-btn" data-value="7:00 بليل">7:00 بليل</button>
          <button type="button" class="time-btn" data-value="8:00 بليل">8:00 بليل</button>
          <button type="button" class="time-btn" data-value="9:00 بليل">9:00 بليل</button>
          <button type="button" class="time-btn" data-value="10:00 بليل">10:00 بليل</button>
        </div>
        <div class="custom-time-wrapper">
          <label for="customTimeInput">أو اختاري ساعة محددة:</label>
          <input type="time" id="customTimeInput" class="custom-time-input" />
        </div>
      </div>

      <!-- Duration Section -->
      <div class="section">
        <h3>⏳ مدة الخروجة</h3>
        <div class="durations-grid" id="durationsGrid">
          <button type="button" class="duration-btn" data-value="خمس دقايق">خمس دقايق</button>
          <button type="button" class="duration-btn" data-value="ربع ساعة">ربع ساعة</button>
          <button type="button" class="duration-btn" data-value="نص ساعة">نص ساعة</button>
          <button type="button" class="duration-btn" data-value="ساعة">ساعة</button>
        </div>
      </div>

      <p id="errorMsg" class="error-msg hidden">اختاري المكان والميعاد والمدة الأول يبسنت 😅</p>
      <button id="confirmBtn" class="btn yes-btn confirm-btn">تأكيد الخروجة 💖</button>
    </div>

    <!-- Step 3: Final Confirmation -->
    <div class="card final-card hidden" id="finalCard">
      <div class="emoji">🎉💞🚗</div>
      <h1>تم الاتفاق يبسنت!</h1>
      <div class="summary-box" id="summaryBox"></div>
      <p class="final-note">جهّزي نفسك بليل، مستنيكي ✨</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
